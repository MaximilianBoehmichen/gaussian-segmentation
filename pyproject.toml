[project]
name = "gaussian-segmentation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "batchgenerators>=0.25.3",
    "beartype==0.23.1",
    "faiss-gpu-cuvs>=1.15.1; sys_platform == 'linux'",
    "faiss-cpu>=1.15.1; sys_platform == 'darwin'",
    "ipykernel>=7.4.0",
    "jaxtyping>=0.3.11",
    "kornia",
    "matplotlib>=3.11.2",
    "monai>=1.6.1",
    "mypy>=1.11",
    "nibabel>=5.4.2",
    "nilearn>=0.14.1",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "torch==2.12.1",
    "torchvision",
    "torch-geometric>=2.8.0",
    "pyg-lib",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
ignore = ["F722"]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
find-links = [
    "https://data.pyg.org/whl/torch-2.12.1+cu132.html",
    "https://data.pyg.org/whl/torch-2.12.1+cpu.html",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu132", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true